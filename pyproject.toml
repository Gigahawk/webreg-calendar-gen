[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[project]
name = "webreg_calendar_gen"
version = "0.1.0"
description = "Calendar reminder generator for Burnaby Webreg class registration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.4.0",
    "ics>=0.7.2",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[project.scripts]
webreg-calendar-gen = "webreg_calendar_gen.main:main"
